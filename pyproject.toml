[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dorm-electricity-monitor"
version = "0.1.0"
description = "Windows tray monitor for dorm electricity balance."
requires-python = ">=3.10"
dependencies = [
  "requests>=2.32.0"
]

[project.scripts]
dorm-electricity-monitor = "dorm_electricity_monitor.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
